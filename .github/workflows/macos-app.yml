name: Build MoleApp (macOS Indicator & App)

# Build otomatis di mesin macOS GitHub → pengguna tinggal unduh MoleApp.zip atau install-MoleApp.zip
# Rilis otomatis mengikuti pola mac-os-lite-monitor: naikkan CFBundleShortVersionString di macos-app/Resources/Info.plist, lalu push ke main.
on:
  push:
    # claude/** ikut dibangun agar branch fitur terverifikasi di mesin macOS; rilis tetap hanya dari main/tag
    branches: [main, "claude/**"]
    tags: ["app-v*"]
    paths:
      - "macos-app/**"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "macos-app/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Baca versi MoleApp
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" macos-app/Resources/Info.plist)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/app-v$V" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MoleApp.app (Universal arm64 + x86_64)
        run: ARCH=universal ./macos-app/scripts/build.sh

      - name: Cek designated requirement codesign
        run: |
          codesign -d -r- macos-app/build/MoleApp.app 2>&1 | tee /dev/stderr \
            | grep -q 'designated => identifier "id.local.moleapp"$'

      - name: Smoke test (jalankan app & tangkap layar dashboard)
        if: "!startsWith(github.ref, 'refs/tags/')"
        continue-on-error: true
        run: |
          mkdir -p macos-app/dist/screens
          macos-app/build/MoleApp.app/Contents/MacOS/MoleApp --dashboard --popover &
          APP_PID=$!
          sleep 25
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::MoleApp berhenti sebelum smoke test selesai"
            exit 1
          fi
          screencapture -x macos-app/dist/screens/dashboard.png || true
          kill "$APP_PID" || true

      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        continue-on-error: true
        with:
          name: MoleApp-screens
          path: macos-app/dist/screens/
          if-no-files-found: ignore

      - name: Buat installer & paket ZIP rilis
        run: |
          ./macos-app/scripts/make-installer.sh
          mkdir -p macos-app/dist
          ditto -c -k --keepParent macos-app/build/MoleApp.app macos-app/dist/MoleApp.zip
          (cd macos-app/dist && zip -q install-MoleApp.zip install-MoleApp.command)
          ls -lh macos-app/dist/

      - uses: actions/upload-artifact@v4
        with:
          name: MoleApp
          path: |
            macos-app/dist/MoleApp.zip
            macos-app/dist/install-MoleApp.zip

      - name: Rilis (saat push tag app-v*)
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: MoleApp ${{ github.ref_name }}
          body: |
            ## Pasang MoleApp
            1. Unduh **MoleApp.zip**, ekstrak, lalu pindahkan **MoleApp.app** ke `/Applications`.
            2. Aplikasi ditandatangani ad-hoc (belum dinotarisasi Apple), jadi hapus karantina sekali:
               ```bash
               /usr/bin/xattr -cr /Applications/MoleApp.app && open /Applications/MoleApp.app
               ```
            Atau unduh **install-MoleApp.zip**, ekstrak, lalu jalankan `bash install-MoleApp.command`.

            Klik kiri ikon di menu bar untuk ringkasan kesehatan & akses cepat, klik kanan untuk pengaturan indikator.
            Mole CLI beserta binary Go sudah dibundle di dalam aplikasi.
          generate_release_notes: true
          files: |
            macos-app/dist/MoleApp.zip
            macos-app/dist/install-MoleApp.zip

      - name: Rilis otomatis (push ke main dengan versi baru di Info.plist)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: MoleApp v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Pasang MoleApp
            1. Unduh **MoleApp.zip**, ekstrak, lalu pindahkan **MoleApp.app** ke `/Applications`.
            2. Aplikasi ditandatangani ad-hoc (belum dinotarisasi Apple), jadi hapus karantina sekali:
               ```bash
               /usr/bin/xattr -cr /Applications/MoleApp.app && open /Applications/MoleApp.app
               ```
            Atau unduh **install-MoleApp.zip**, ekstrak, lalu jalankan `bash install-MoleApp.command`.

            Klik kiri ikon di menu bar untuk ringkasan kesehatan & akses cepat, klik kanan untuk pengaturan indikator.
            Mole CLI beserta binary Go sudah dibundle di dalam aplikasi.
          generate_release_notes: true
          files: |
            macos-app/dist/MoleApp.zip
            macos-app/dist/install-MoleApp.zip
